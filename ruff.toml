# Ruff 静态检查配置，须在仓库根目录执行（否则读不到本文件）

# Python 语法目标版本
target-version = "py310"

# 行宽；E501 已忽略，此值用于导入块与字符串的换行判定
line-length = 120

# Ruff 版本下限；CI 固定 ==0.16.9
required-version = ">=0.16.7"

[lint]
# 高信号规则集:E 风格错误 / F 真实缺陷 / I 导入排序 / UP 语法现代化
# B bugbear / SIM 简化 / C4 推导式 / RUF ruff 特有
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = [
    "E501",  # 行宽不统一（存在 200+ 字符长行），交给 formatter 单独处理
    "B008",  # Flask 扩展（如 Flask-Login 的 user_loader 等）在默认参数中调用属标准用法
    "RUF001", "RUF002", "RUF003",  # 中文注释/全角标点被误判为易混淆字符，禁用
]

[lint.per-file-ignores]
"smoke_test.py" = ["E402"]  # 冒烟测试按轮次分组组织 import
"tests/test_models.py" = ["S105"]  # 测试中使用明文测试密码
