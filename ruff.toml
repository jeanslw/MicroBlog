# ══════════════════════════════════════════════════════════════════════════
#  MicroBlog —— Ruff 静态检查配置（仓库级，随代码进版本库）
# ══════════════════════════════════════════════════════════════════════════
#  项目名称 : MicroBlog
#  项目版本 : 1.3.5              # 真源是 config.py 的 APP_VERSION，发布时须与 Git Tag 一致
#  Python   : >=3.10（推荐 3.11；CI 覆盖 3.10 / 3.11 / 3.12）
#  Ruff     : >=0.16.7（CI 固定 0.16.9，见 .github/workflows/ci.yml）
#
#  说明：ruff.toml 只接受 ruff 自身的配置项，项目名 / 项目版本号**不是**合法键
#  （写进去会以 `unknown field` 直接解析失败），因此上述元信息以注释形式记录，
#  机器可读的版本约束由下面的 required-version 承担。
# ──────────────────────────────────────────────────────────────────────────
#  为什么单独放一个 ruff.toml：这些设置原本写在 pyproject.toml 的 [tool.ruff] 中，
#  而 pyproject.toml 已从仓库移除（.gitignore 忽略该文件，见 commit 52fa373）。
#  一旦磁盘上没有任何 ruff 配置，`ruff check` 就会退回 ruff 内置的宽泛默认规则集
#  （0.16.x 默认启用 400+ 条规则，含 BLE001/DTZ/PLR/FURB/PLW 等），CI 立刻报出
#  数十条与项目既定风格无关的错误。规则集必须显式声明在此文件里，避免再次漂移。
#
#  使用方式（务必在仓库根目录执行，否则读不到本文件）：
#      ruff check app config.py run.py tests
# ══════════════════════════════════════════════════════════════════════════

# Python 语法目标版本（决定 UP 等规则给出的现代化建议范围，沿用原 pyproject.toml 取值）
target-version = "py310"

# 行宽（与原 pyproject.toml 一致；E501 已忽略，此值主要用于导入块/字符串的换行判定）
line-length = 120

# 运行 ruff 的版本下限：低于本地验证基线时直接报错，避免在旧版本上得到不同结论
# （0.16.7 / 0.16.8 / 0.16.9 三版实测结论一致；CI 进一步固定为 ==0.16.9）
required-version = ">=0.16.7"

[lint]
# 高信号规则集：E 风格错误 / F 真实缺陷 / I 导入排序 / UP 语法现代化
# B bugbear / SIM 简化 / C4 推导式 / RUF ruff 特有
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = [
    "E501",  # 行宽不统一（存在 200+ 字符长行），交给 formatter 单独处理
    "B008",  # Flask 扩展（如 Flask-Login 的 user_loader 等）在默认参数中调用属标准用法
    "RUF001", "RUF002", "RUF003",  # 中文注释/全角标点被误判为易混淆字符，禁用
]

[lint.per-file-ignores]
"smoke_test.py" = ["E402"]        # 冒烟测试按轮次分组组织 import，非顶部导入是有意为之
"tests/test_models.py" = ["S105"] # 测试中故意使用明文测试密码（启用 S 族后生效）
