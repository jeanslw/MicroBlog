[uwsgi]
# 模块入口
module = wsgi
callable = application

# 项目路径（按实际部署路径修改，请勿硬编码）
chdir = /opt/flaskProject
virtualenv = /opt/flaskProject/.venv

# 进程与线程
processes = 4
threads = 2
master = true

# 通信方式（socket 配合 Nginx，http 用于直接访问调试）
socket = /tmp/flask_blog.sock
chmod-socket = 666
# 如果不用 Nginx，改 http 直出：
# http = 0.0.0.0:5000

# 日志
logto = /var/log/uwsgi/flask_blog.log
log-maxsize = 52428800

# 进程管理
pidfile = /tmp/flask_blog.pid
vacuum = true
die-on-term = true

# 请求限制
buffer-size = 65535
harakiri = 60
max-requests = 5000

# ============================================================
# 环境变量配置（推荐改用项目根目录 .env 文件，更易管理）
# 若已使用 .env，下方 env = 行可删除避免重复
# ============================================================
# 必填：生产环境标识
env = BLOG_ENV=production
# 必填：Session/CSRF 密钥，生成命令：
#   python -c "import secrets;print(secrets.token_hex(32))"
env = BLOG_SECRET_KEY=请替换为64位随机字符串
# 调试模式（生产保持 False）
env = BLOG_DEBUG=False

# 数据库类型：sqlite 或 mysql
env = BLOG_DB_TYPE=mysql
# MySQL 配置（BLOG_DB_TYPE=mysql 时生效）
env = BLOG_MYSQL_HOST=localhost
env = BLOG_MYSQL_USER=blog_user
env = BLOG_MYSQL_PWD=请替换为数据库密码
env = BLOG_MYSQL_DB=flask_blog
# SQLite 配置（BLOG_DB_TYPE=sqlite 时生效）
# env = BLOG_SQLITE_PATH=data/blog.db

# 业务参数
env = BLOG_PAGE_SIZE=6
env = BLOG_STATIC_MAX_AGE=43200

# 初始管理员（仅 SQLite 首次建表写入一次，mysql 请手动 INSERT）
env = BLOG_INIT_ADMIN_USER=admin
env = BLOG_INIT_ADMIN_PWD=首次部署请设置强密码
