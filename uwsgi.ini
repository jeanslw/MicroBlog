[uwsgi]
# 模块入口
module = wsgi
callable = application

# 项目路径（%d = 本文件所在目录，Linux 与 Docker 通用）
chdir = %d
# 虚拟环境不在此配置：裸机在 venv 内安装并运行 uwsgi（uwsgi 二进制来自 venv 即生效）；
# Docker 依赖装在系统 Python，保持注释状态即可两环境通用
#virtualenv = /path/to/.venv

# 进程与线程
processes = 4
threads = 2
master = true

# 通信方式（默认 HTTP 直出，nginx 走 proxy_pass；切换 uwsgi 协议时二选一改用 socket）
http = 0.0.0.0:5000
#socket = 0.0.0.0:5000
# 探针口（HTTP 协议，恒开）：容器 HEALTHCHECK 与本机巡检固定用此口，
# 切换 uwsgi 协议模式后 5000 变为 uwsgi 二进制协议，curl 只认此口
http-socket = 127.0.0.1:5001

# 日志（/tmp 两环境均可写；裸机正式部署可改为 /var/log 下路径，root 运行）
logto = /tmp/microblog-uwsgi.log
log-maxsize = 52428800

# 进程管理
pidfile = /tmp/microblog.pid
vacuum = true
die-on-term = true

# 请求限制
buffer-size = 65535
harakiri = 60
max-requests = 5000
