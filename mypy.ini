# mypy config; must run from the repo root, otherwise this file is not picked up.

[mypy]
python_version = 3.10
files = app, config.py, run.py, wsgi.py

[mypy-app.models]
# db.Model is generated at runtime by Flask-SQLAlchemy, which mypy cannot resolve.
disable_error_code = name-defined

# per-module overrides in ini files use [mypy-<pattern>] sections.
# The [[mypy.overrides]] table syntax is pyproject.toml-only.
[mypy-flask_babel,flask_babel.*,flask_login,flask_login.*,flask_wtf,flask_wtf.*,wtforms,wtforms.*,flask_migrate,flask_migrate.*,feedgen,feedgen.*]
ignore_missing_imports = true
