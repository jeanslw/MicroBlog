# ============================================================================
#  MicroBlog -- mypy static type-check config (repo-level, committed to VCS)
# ============================================================================
#  Project   : MicroBlog
#  Version   : 1.3.5            # single source of truth: APP_VERSION in config.py
#  Python    : >=3.10 (3.11 recommended; CI covers 3.10 / 3.11 / 3.12)
#  mypy      : 1.13.0 (CI pins the same version, see .github/workflows/ci.yml)
#
#  NOTE: comments in this file MUST stay ASCII-only. mypy reads its config via
#  Python's configparser, which decodes with the LOCALE encoding -- on
#  zh-CN Windows that is GBK and any UTF-8 Chinese comment crashes mypy with
#  UnicodeDecodeError. (ruff.toml is unaffected: ruff is Rust and always
#  reads UTF-8. Detailed rationale for each decision lives in the commit
#  message and in docs; keep this file terse.)
#
#  Positioning: same philosophy as ruff.toml -- catch defect-level type errors
#  (undefined names, obviously wrong argument/return types in annotated
#  functions), not 100% strict typing. Therefore:
#  - unannotated function bodies are not deeply checked (mypy default);
#  - third-party libs without official stubs are ignored per-module below;
#  - known blind spots of legacy Flask-SQLAlchemy Column models (db.Model is
#    a runtime-generated base class; instance attrs are scalars at runtime but
#    Column[T] statically) are exempted with the narrowest possible
#    disable_error_code / inline `# type: ignore[...]`, each with a comment
#    at the call site.
#
#  Why mypy instead of pyright in CI: pyright (even basic mode) produces ~170
#  Column[T]-interop false positives on legacy Column models. mypy reaches a
#  zero-noise baseline with this file. pyrightconfig.json keeps serving the
#  IDE (VS Code Pylance); the two do not conflict.
#
#  Usage (run from repo root, otherwise this file is not picked up):
#      mypy                                  # files are declared below
#      mypy app config.py run.py wsgi.py     # equivalent explicit form
# ============================================================================

[mypy]
python_version = 3.10
files = app, config.py, run.py, wsgi.py

[mypy-app.models]
# db.Model is generated at runtime by Flask-SQLAlchemy; mypy cannot resolve it
# statically, so every model class definition line raises name-defined.
# models.py is fully covered by 301 pytest cases -- any real NameError is
# caught immediately by tests, hence this error code is disabled for this
# module only. Remove this section once models migrate to SQLAlchemy 2.0
# native DeclarativeBase + Mapped[] annotations.
disable_error_code = name-defined

# NOTE: per-module overrides in ini files use [mypy-<pattern>] sections
# (comma-separated patterns allowed in the section header). The
# [[mypy.overrides]] table syntax is pyproject.toml-only and is silently
# ignored here.
[mypy-flask_babel,flask_babel.*,flask_login,flask_login.*,flask_wtf,flask_wtf.*,wtforms,wtforms.*,flask_migrate,flask_migrate.*,feedgen,feedgen.*]
ignore_missing_imports = true
