name: Auto Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect prerelease
        id: prerelease_check
        run: |
          if [[ "${{ github.ref_name }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc|dev|preview)$ ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract current version changelog
        id: extract_changelog
        run: |
          VERSION="${{ github.ref_name }}"
          python3 - "$VERSION" "$GITHUB_OUTPUT" <<'PY'
          import re
          import sys
          from pathlib import Path

          ver, out_path = sys.argv[1], sys.argv[2]
          print(f"::debug::extract version={ver!r}")
          changelog = Path("docs/CHANGELOG.md")
          if not changelog.exists():
              body = "⚠️ CHANGELOG.md not found"
              print("::debug::CHANGELOG.md not found")
          else:
              out, found = [], False
              # Match headings like ## v1.3.0 ... or ## [v1.3.0] ...
              heading_re = re.compile(r"^##\s+\[?(?:v?)(\d+\.\d+\.\d+)\]?")
              lines = changelog.read_text(encoding="utf-8-sig").splitlines()
              print(f"::debug::CHANGELOG first 5 lines={lines[:5]!r}")
              for i, line in enumerate(lines, start=1):
                  m = heading_re.match(line)
                  if m:
                      print(f"::debug::line {i} heading={line!r} ver={m.group(1)!r}")
                      if found:
                          break
                      if m.group(1) == ver.lstrip("v"):
                          found = True
                          print(f"::debug::matched version at line {i}")
                          continue
                  if found:
                      out.append(line)
              body = "\n".join(out) if out else f"No changelog entry found for {ver}"
              print(f"::debug::extracted lines={len(out)}")

          with open(out_path, "a", encoding="utf-8") as fh:
              fh.write(f"changelog<<EOF\n{body}\nEOF\n")
          PY

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: ${{ steps.extract_changelog.outputs.changelog }}
          draft: false
          prerelease: ${{ steps.prerelease_check.outputs.is_prerelease }}
          update_release_body: true
          update_release_name: true