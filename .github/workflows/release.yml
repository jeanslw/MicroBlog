name: Auto Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect prerelease
        id: prerelease_check
        run: |
          if [[ "${{ github.ref_name }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc|dev|preview)$ ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract current version changelog
        id: extract_changelog
        run: |
          VERSION="${{ github.ref_name }}"
          python3 - "$VERSION" "$GITHUB_OUTPUT" <<'PY'
          import re
          import sys
          from pathlib import Path

          ver, out_path = sys.argv[1], sys.argv[2]
          changelog = Path("docs/CHANGELOG.md")
          if not changelog.exists():
              body = "⚠️ CHANGELOG.md not found"
          else:
              out, found = [], False
              heading = re.compile(r"^##\s+\[?v?\d+\.\d+\.\d+\]?")
              for line in changelog.read_text(encoding="utf-8").splitlines():
                  if heading.match(line):
                      if found:
                          break
                      m = re.search(r"v?\d+\.\d+\.\d+", line)
                      if m and m.group(0) == ver:
                          found = True
                          continue
                  if found:
                      out.append(line)
              body = "\n".join(out) if out else f"No changelog entry found for {ver}"

          with open(out_path, "a", encoding="utf-8") as fh:
              fh.write(f"changelog<<EOF\n{body}\nEOF\n")
          PY

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: ${{ steps.extract_changelog.outputs.changelog }}
          draft: false
          prerelease: ${{ steps.prerelease_check.outputs.is_prerelease }}
          update_release_body: true
          update_release_name: true