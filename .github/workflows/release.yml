name: Auto Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect prerelease
        id: prerelease_check
        run: |
          if [[ "${{ github.ref_name }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc|dev|preview)$ ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract current version changelog
        id: extract_changelog
        run: |
          VERSION="${{ github.ref_name }}"
          python3 - "$VERSION" <<'PY'
          import re
          import sys
          from pathlib import Path

          ver = sys.argv[1]
          print(f"::debug::extract version={ver!r}")
          changelog = Path("docs/CHANGELOG.md")
          if not changelog.exists():
              body = "⚠️ CHANGELOG.md not found"
              print("::debug::CHANGELOG.md not found")
          else:
              out, found = [], False
              # Match headings like ## v1.3.0 ... or ## [v1.3.0] ...
              heading_re = re.compile(r"^##\s+\[?(?:v?)(\d+\.\d+\.\d+)\]?")
              lines = changelog.read_text(encoding="utf-8-sig").splitlines()
              print(f"::debug::CHANGELOG first 5 lines={lines[:5]!r}")
              for i, line in enumerate(lines, start=1):
                  m = heading_re.match(line)
                  if m:
                      print(f"::debug::line {i} heading={line!r} ver={m.group(1)!r}")
                      if found:
                          break
                      if m.group(1) == ver.lstrip("v"):
                          found = True
                          print(f"::debug::matched version at line {i}")
                          continue
                  if found:
                      out.append(line)
              body = "\n".join(out) if out else f"No changelog entry found for {ver}"
              print(f"::debug::extracted lines={len(out)}")

          Path("release_notes.md").write_text(body + "\n", encoding="utf-8")
          print(f"::debug::wrote release_notes.md ({len(body)} chars)")
          PY

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ github.ref_name }}"
          TITLE="Release ${VERSION}"
          NOTES="release_notes.md"
          IS_PRERELEASE="${{ steps.prerelease_check.outputs.is_prerelease }}"
          if [ "$IS_PRERELEASE" = "true" ]; then
            PRERELEASE="--prerelease"
          else
            PRERELEASE=""
          fi

          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists -> updating it"
            gh release edit "$VERSION" --title "$TITLE" --notes-file "$NOTES" $PRERELEASE
          else
            echo "Creating release $VERSION"
            gh release create "$VERSION" --title "$TITLE" --notes-file "$NOTES" $PRERELEASE
          fi