name: Auto Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 发布前的闸门:Release 的版本必须与推送的 tag 一致.
  # release notes 一律取自 docs/CHANGELOG.md 中该 tag 对应的章节,抓不到就中止,
  # 避免发出"标题写 v1.4.0、正文却是占位提示"这种版本与 tag 对不上的 Release.
  verify-release-version:
    name: Verify the release matches the tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the changelog has a section for this tag
        run: |
          set -euo pipefail
          python3 - "${{ github.ref_name }}" <<'PY'
          import re
          import sys
          from pathlib import Path

          tag = sys.argv[1]
          # v1.4.0-rc1 -> 1.4.0:预发布后缀不参与章节匹配
          expected = tag.split("-", 1)[0].lstrip("v")
          # 与下方 release notes 抽取步骤同一套标题规则:## v0.0.0 ... 与 ## [v0.0.0] ...
          heading_re = re.compile(r"^##\s+\[?(?:v?)(\d+\.\d+\.\d+)\]?")
          changelog = Path("docs/CHANGELOG.md")

          if not changelog.exists():
              print("::error::docs/CHANGELOG.md 不存在,无法生成该 tag 的 release notes")
              sys.exit(1)

          found = False
          for line in changelog.read_text(encoding="utf-8-sig").splitlines():
              m = heading_re.match(line)
              if m and m.group(1) == expected:
                  found = True
                  break
          if not found:
              print(f"::error::docs/CHANGELOG.md 中没有 {tag} 的章节,release notes 与 tag 不一致,发布已中止")
              sys.exit(1)
          print(f"release notes 将取自 docs/CHANGELOG.md 的 v{expected} 章节")
          PY

  release:
    needs: verify-release-version
    runs-on: ubuntu-latest
    steps:
      # 所有 action 一律 pin 到完整 commit SHA(GitHub 官方供应链安全建议):
      # 浮动 tag 可被上游强推/劫持,SHA 不可变;行尾注释保留版本号便于检索升级.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect prerelease
        id: prerelease_check
        run: |
          if [[ "${{ github.ref_name }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc|dev|preview)$ ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract current version changelog
        id: extract_changelog
        run: |
          VERSION="${{ github.ref_name }}"
          python3 - "$VERSION" <<'PY'
          import re
          import sys
          from pathlib import Path

          ver = sys.argv[1]
          changelog = Path("docs/CHANGELOG.md")
          if not changelog.exists():
              body = "⚠️ CHANGELOG.md not found"
          else:
              out, found = [], False
              # 兼容标题格式:## v0.0.0 ... 与 ## [v0.0.0] ...
              heading_re = re.compile(r"^##\s+\[?(?:v?)(\d+\.\d+\.\d+)\]?")
              lines = changelog.read_text(encoding="utf-8-sig").splitlines()
              for line in lines:
                  m = heading_re.match(line)
                  if m:
                      if found:
                          break
                      if m.group(1) == ver.lstrip("v"):
                          found = True
                          continue
                  if found:
                      out.append(line)
              body = "\n".join(out) if out else f"No changelog entry found for {ver}"

          Path("release_notes.md").write_text(body + "\n", encoding="utf-8")
          PY

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ github.ref_name }}"
          HEAD_SHA="$(git rev-parse HEAD)"
          TITLE="Release ${VERSION}"
          NOTES="release_notes.md"

          PRERELEASE_FLAG=""
          if [ "${{ steps.prerelease_check.outputs.is_prerelease }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          create_release() {
            echo "Creating release ${VERSION} @ ${HEAD_SHA}"
            gh release create "$VERSION" --title "$TITLE" --notes-file "$NOTES" --draft=false $PRERELEASE_FLAG
          }

          if gh release view "$VERSION" >/dev/null 2>&1; then
            TARGET="$(gh release view "$VERSION" --json targetCommitish --jq .targetCommitish)"
            echo "Existing release ${VERSION} (target=${TARGET}, HEAD=${HEAD_SHA})"
            if [ "$TARGET" != "$HEAD_SHA" ]; then
              # 旧 release 指向过期 commit(如 tag 被 force-push / 重建后残留)
              echo "Target mismatch -> deleting stale release and recreating"
              gh release delete "$VERSION" --yes
              for i in $(seq 1 30); do
                if ! gh release view "$VERSION" >/dev/null 2>&1; then break; fi
                echo "Waiting for release deletion to propagate ($i)..."
                sleep 2
              done
              create_release
            else
              # 同 commit:更新 title/body,并确保最终为正式发布(非 draft)
              echo "Updating release ${VERSION} and ensuring it is published"
              gh release edit "$VERSION" --title "$TITLE" --notes-file "$NOTES" --draft=false $PRERELEASE_FLAG
            fi
          else
            create_release
          fi

          # 最终校验:确认 release 已正式发布,且该 Release 挂的就是本次推送的 tag
          if ! gh release view "$VERSION" --json isDraft --jq '.isDraft' 2>/dev/null | grep -q '^false$'; then
            echo "::error::Release ${VERSION} is still not published"
            exit 1
          fi
          RELEASE_TAG="$(gh release view "$VERSION" --json tagName --jq .tagName)"
          if [ "$RELEASE_TAG" != "$VERSION" ]; then
            echo "::error::Release ${VERSION} is attached to tag ${RELEASE_TAG}"
            exit 1
          fi
          echo "Release ${VERSION} is live"