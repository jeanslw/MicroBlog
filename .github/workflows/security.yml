name: Security Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read

jobs:
  security:
    name: Dependency & Secret Scan
    runs-on: ubuntu-latest
    steps:
      # 所有 action 一律 pin 到完整 commit SHA；行尾注释保留版本号便于检索升级
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip

      # pip-audit 固定版本，保证扫描结果可复现
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pip-audit==2.10.1"

      - name: Python syntax check
        run: python -m compileall -q app config.py run.py wsgi.py tests

      # PR 上已知漏洞仅告警，push main 与定时任务硬失败
      - name: Dependency vulnerability audit (pip-audit)
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            pip-audit -r requirements.txt || echo "::warning::Known vulnerabilities found, please review"
          else
            pip-audit -r requirements.txt
          fi

      # 只匹配真实凭证格式（GitHub / GitLab / AWS / Slack / 私钥等），排除 .venv / .git / static / .github / *.example
      - name: Hardcoded credential scan
        run: |
          set -e
          if grep -rInE "(glpat-[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{22,}|AKIA[0-9A-Z]{16}|xox[baprs]-[A-Za-z0-9-]{10,}|-----BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY-----)" \
              --include="*.py" --include="*.html" --include="*.js" --include="*.json" \
              --include="*.yml" --include="*.yaml" --include="*.toml" --include="*.sh" \
              --include="*.ini" --include="*.cfg" --include="*.sql" \
              --exclude-dir=.git --exclude-dir=.venv --exclude-dir=.github \
              --exclude-dir=static --exclude-dir=node_modules \
              --exclude="*.env.example" --exclude="*.example" .; then
            echo "::error::Found hardcoded credentials"
            exit 1
          else
            echo "No hardcoded credentials found"
          fi
