name: Security Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read

jobs:
  security:
    name: Dependency & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python syntax check
        run: python -m compileall -q app config.py run.py tests

      - name: Dependency vulnerability audit (pip-audit)
        continue-on-error: true
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt

      - name: Hardcoded secret scan
        run: |
          set -e
          if grep -rInE "(api[_-]?key|secret|password|token|SECRET_KEY)\s*[:=]\s*[\"'][A-Za-z0-9_\-]{16,}[\"']" \
              --include="*.py" --include="*.html" --include="*.toml" \
              --include="*.yml" --include="*.yaml" --exclude-dir=.git .; then
            echo "::error::Found potential hardcoded secret"
            exit 1
          else
            echo "No obvious hardcoded secrets found"
          fi
