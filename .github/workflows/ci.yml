name: CI

on:
  push:
    branches:
      - main
      - 'release/**'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  pull_request:
    branches:
      - main
      - 'release/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Format & Type Check
    runs-on: ubuntu-latest
    steps:
      # 所有 action 一律 pin 到完整 commit SHA；行尾注释保留版本号便于检索升级
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip

      # ruff / mypy 固定版本，规则集声明在仓库根目录 ruff.toml / mypy.ini
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "ruff==0.16.9" "mypy==1.13.0"

      # 依赖一致性校验：requirements.txt 内各包的版本约束互不冲突
      - name: Validate dependency consistency (pip check)
        run: pip check

      - name: Ruff lint
        run: ruff check app config.py run.py wsgi.py tests

      # 格式门禁：ruff.toml 已忽略 E501，行宽判定交给 formatter；wsgi.py 为 gunicorn 生产入口
      - name: Ruff format check
        run: ruff format --check app config.py run.py wsgi.py tests

      # 类型检查：配置在仓库根目录 mypy.ini，无参数运行时自动读取其中的 files
      - name: Type check (mypy)
        run: mypy

      - name: Python syntax check
        run: python -m compileall -q app config.py run.py wsgi.py tests

  test:
    name: Pytest (Python ${{ matrix.python-version }})
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest-cov

      # .coveragerc（仓库根目录）声明覆盖率口径：只统计 app/ 业务代码
      - name: Run tests with coverage
        env:
          BLOG_ENV: testing
        run: pytest --cov=app --cov-report=term-missing

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@2320916714171c258d01dbd81040d64d798c6f8e # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
