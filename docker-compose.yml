# ============================================================
# Flask 博客系统 Docker Compose 编排
# 包含：web(Flask) + db(MySQL 8) + nginx(反代, 可选)
#
# 使用方法：
#   1. 复制 .env.docker.example 为 .env.docker，按需修改变量
#   2. docker compose --env-file .env.docker up -d
#   3. 访问 http://localhost（经 nginx）或 http://localhost:5000（直连）
#
# 仅启动 web（SQLite 模式）：
#   docker compose up -d web
# ============================================================
version: "3.9"

services:
  # ──────────────────────────────────────────────────────────
  # Flask 应用（gunicorn）
  # ──────────────────────────────────────────────────────────
  web:
    build: .
    image: flask-blog:latest
    container_name: flask-blog-web
    restart: unless-stopped
    environment:
      # ─ 安全 ─
      BLOG_ENV: production
      BLOG_SECRET_KEY: ${BLOG_SECRET_KEY:?必须在 .env.docker 中设置 BLOG_SECRET_KEY}
      BLOG_DEBUG: "False"

      # ─ 数据库类型：sqlite 或 mysql ─
      # 用 mysql 时下方 BLOG_MYSQL_* 生效；用 sqlite 时 BLOG_SQLITE_PATH 生效
      BLOG_DB_TYPE: ${BLOG_DB_TYPE:-mysql}

      # ─ MySQL 连接（指向同 compose 的 db 服务） ─
      BLOG_MYSQL_HOST: db
      BLOG_MYSQL_USER: ${MYSQL_USER:-blog}
      BLOG_MYSQL_PWD: ${MYSQL_PASSWORD:?必须在 .env.docker 中设置 MYSQL_PASSWORD}
      BLOG_MYSQL_DB: ${MYSQL_DATABASE:-flask_blog}

      # ─ SQLite 路径（仅 BLOG_DB_TYPE=sqlite 时使用） ─
      BLOG_SQLITE_PATH: data/blog.db

      # ─ 业务参数 ─
      BLOG_PAGE_SIZE: ${BLOG_PAGE_SIZE:-6}
      BLOG_STATIC_MAX_AGE: ${BLOG_STATIC_MAX_AGE:-43200}

      # ─ 初始管理员（仅 SQLite 首次建表写入一次） ─
      BLOG_INIT_ADMIN_USER: ${BLOG_INIT_ADMIN_USER:-admin}
      BLOG_INIT_ADMIN_PWD: ${BLOG_INIT_ADMIN_PWD:-}
    ports:
      - "5000:5000"
    volumes:
      # SQLite 数据文件持久化（mysql 模式下也无害）
      - ./data:/app/data
      # 上传的轮播图持久化
      - ./static/banner:/app/static/banner
    depends_on:
      db:
        condition: service_healthy
    # 仅 SQLite 模式时，去掉 depends_on 即可单跑 web
    profiles: ["full", "mysql"]
    networks:
      - blog-net

  # ──────────────────────────────────────────────────────────
  # MySQL 8.0 数据库
  # ──────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: flask-blog-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?必须在 .env.docker 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-flask_blog}
      MYSQL_USER: ${MYSQL_USER:-blog}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?必须在 .env.docker 中设置 MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --sql-mode=STRICT_TRANS_TABLES,NO_ENGINE_SUBSTITUTION
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - blog-mysql-data:/var/lib/mysql
      # 首次启动自动导入建表 SQL
      - ./MySQL/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    ports:
      # 如不需要从宿主机连数据库，可注释下行
      - "3306:3306"
    profiles: ["full", "mysql"]
    networks:
      - blog-net

  # ──────────────────────────────────────────────────────────
  # Nginx 反向代理（可选，生产推荐）
  # 启用方式：docker compose --profile full up -d
  # ──────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: flask-blog-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/app/static:ro
    depends_on:
      - web
    profiles: ["full"]
    networks:
      - blog-net

# ──────────────────────────────────────────────────────────
# 持久化卷
# ──────────────────────────────────────────────────────────
volumes:
  blog-mysql-data:
    name: flask-blog-mysql-data

# ──────────────────────────────────────────────────────────
# 内部网络
# ──────────────────────────────────────────────────────────
networks:
  blog-net:
    name: flask-blog-net
    driver: bridge
