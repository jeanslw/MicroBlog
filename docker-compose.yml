# ============================================================
# Flask 博客系统 Docker Compose 编排
# 包含：web(Flask) + db(MySQL 8) + nginx(反代, 可选)
#
# 使用方法：
#   1. 复制 .env.docker.example 为 .env.docker，按需修改变量
#   2. docker compose --env-file .env.docker up -d
#   3. 访问 http://localhost（经 nginx）或 http://localhost:5000（直连）
#
# 仅启动 web（SQLite 模式）：
#   docker compose up -d web
# ============================================================
version: "3.9"

services:
  # ──────────────────────────────────────────────────────────
  # Flask 应用（gunicorn）
  # ──────────────────────────────────────────────────────────
  web:
    build: .
    image: flask-blog:latest
    container_name: flask-blog-web
    restart: unless-stopped
    environment:
      # ─ 安全 ─
      BLOG_ENV: production
      BLOG_SECRET_KEY: ${BLOG_SECRET_KEY:?必须在 .env.docker 中设置 BLOG_SECRET_KEY}
      BLOG_DEBUG: "False"
      # 生产默认 true；仅本地明文 HTTP 调试时在 .env.docker 设置 false
      BLOG_COOKIE_SECURE: ${BLOG_COOKIE_SECURE:-}
      # 固定外链域名（邮件重置链接/订阅源/sitemap 使用，防 Host 头注入）
      # 生产请改为真实域名，如 https://blog.example.com
      BLOG_CANONICAL_URL: ${BLOG_CANONICAL_URL:-}
      # Host 白名单（逗号分隔），非白名单 Host 请求返回 400
      BLOG_TRUSTED_HOSTS: ${BLOG_TRUSTED_HOSTS:-}

      # ─ 数据库类型：sqlite 或 mysql ─
      # 用 mysql 时下方 BLOG_MYSQL_* 生效；用 sqlite 时 BLOG_SQLITE_PATH 生效
      BLOG_DB_TYPE: ${BLOG_DB_TYPE:-mysql}

      # ─ MySQL 连接（指向同 compose 的 db 服务） ─
      BLOG_MYSQL_HOST: db
      BLOG_MYSQL_USER: ${MYSQL_USER:-blog}
      BLOG_MYSQL_PWD: ${MYSQL_PASSWORD:?必须在 .env.docker 中设置 MYSQL_PASSWORD}
      BLOG_MYSQL_DB: ${MYSQL_DATABASE:-flask_blog}

      # ─ SQLite 路径（仅 BLOG_DB_TYPE=sqlite 时使用） ─
      BLOG_SQLITE_PATH: data/blog.db

      # ─ 业务参数 ─
      BLOG_PAGE_SIZE: ${BLOG_PAGE_SIZE:-6}
      BLOG_STATIC_MAX_AGE: ${BLOG_STATIC_MAX_AGE:-43200}
      # 密码找回令牌有效期（秒，默认 1800）
      BLOG_RESET_TOKEN_MAX_AGE: ${BLOG_RESET_TOKEN_MAX_AGE:-1800}

      # ─ SMTP 邮件（可选）：不配置时在 管理后台 → 邮件设置 中填写（后台优先） ─
      BLOG_MAIL_HOST: ${BLOG_MAIL_HOST:-}
      BLOG_MAIL_PORT: ${BLOG_MAIL_PORT:-587}
      BLOG_MAIL_USER: ${BLOG_MAIL_USER:-}
      BLOG_MAIL_PASSWORD: ${BLOG_MAIL_PASSWORD:-}
      BLOG_MAIL_FROM: ${BLOG_MAIL_FROM:-}
      BLOG_MAIL_USE_SSL: ${BLOG_MAIL_USE_SSL:-false}
      BLOG_MAIL_USE_TLS: ${BLOG_MAIL_USE_TLS:-true}

      # ─ 反代头解析（经 nginx 时取真实客户端 IP / 协议） ─
      BLOG_PROXY_XFOR: "1"
      BLOG_PROXY_XPROTO: "1"

      # ─ 初始管理员（仅 SQLite 首次建表写入一次） ─
      BLOG_INIT_ADMIN_USER: ${BLOG_INIT_ADMIN_USER:-admin}
      BLOG_INIT_ADMIN_PWD: ${BLOG_INIT_ADMIN_PWD:-}
    # 生产环境经 nginx 反代访问，不直接暴露 5000；如需直连调试可取消注释
    # ports:
    #   - "5000:5000"
    volumes:
      # SQLite 数据文件持久化（mysql 模式下也无害）
      - ./data:/app/data
      # 上传的轮播图持久化
      - ./static/banner:/app/static/banner
      # 文章图 / Logo / 自定义背景持久化（nginx 也从宿主机同目录读）
      - ./static/uploads:/app/static/uploads
      # 数据库备份持久化（容器重建不丢失）
      - ./backups:/app/backups
    # web 不设 profile、不强制 depends_on：
    #   - SQLite 模式：docker compose up -d web（仅启动 web，DB 异常由应用兜底）
    #   - MySQL 模式：docker compose --profile mysql up -d（web + db）
    #   - 完整模式：  docker compose --profile full up -d（web + db + nginx）
    networks:
      - blog-net

  # ──────────────────────────────────────────────────────────
  # MySQL 8.0 数据库
  # ──────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: flask-blog-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?必须在 .env.docker 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-flask_blog}
      MYSQL_USER: ${MYSQL_USER:-blog}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?必须在 .env.docker 中设置 MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --sql-mode=STRICT_TRANS_TABLES,NO_ENGINE_SUBSTITUTION
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - blog-mysql-data:/var/lib/mysql
      # 首次启动自动导入建表 SQL
      - ./MySQL/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # 默认不暴露 MySQL 端口到宿主机；如需从宿主机连数据库，取消下方注释
    # ports:
    #   - "3306:3306"
    profiles: ["full", "mysql"]
    networks:
      - blog-net

  # ──────────────────────────────────────────────────────────
  # Nginx 反向代理（可选，生产推荐）
  # 启用方式：docker compose --profile full up -d
  # ──────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: flask-blog-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/app/static:ro
    depends_on:
      - web
    profiles: ["full"]
    networks:
      - blog-net

# ──────────────────────────────────────────────────────────
# 持久化卷
# ──────────────────────────────────────────────────────────
volumes:
  blog-mysql-data:
    name: flask-blog-mysql-data

# ──────────────────────────────────────────────────────────
# 内部网络
# ──────────────────────────────────────────────────────────
networks:
  blog-net:
    name: flask-blog-net
    driver: bridge
