# ============================================================
# Flask 博客系统 Docker Compose 编排
# 包含：web(Flask) + db(MySQL 8) + nginx(反代, 可选)
#
# 快速开始（MySQL）：
#   1. cp .env.docker.example .env.docker
#   2. 填写 .env.docker 中的 MYSQL_ROOT_PASSWORD / MYSQL_PASSWORD
#      （BLOG_DB_TYPE=mysql 为默认值，其余变量均可保持默认）
#      ⚠️ 守卫提示：两个密码若仍是模板占位符（请替换为强密码）或公开默认值，
#      env-check 预检会中止启动，防止带着弱口令上生产
#   3. docker compose --env-file .env.docker --profile full up -d
#   4. 访问 http://localhost（经 nginx）；首访 /admin/setup 创建管理员
#
# SQLite（无需数据库账号，也无需 .env.docker）：
#   docker compose up -d web
#   访问 http://127.0.0.1:5000
#   注：compose 会隐式读取项目根 .env（应用侧配置文件已更名为 app.env，
#   compose 不再读取它）；仅当目录残留旧版 .env 且其中含 BLOG_DB_TYPE=mysql 时
#   才会影响该模式默认值，此时用 --env-file 指向仅含 BLOG_DB_TYPE=sqlite 的文件即可。
#
# profile 说明：
#   （无）            docker compose up -d web        仅 web（SQLite）
#   --profile mysql   web + db（MySQL，自行外接反代）
#   --profile full    web + db + nginx（HTTP 80 开箱即用）
# ============================================================

services:
  # ──────────────────────────────────────────────────────────
  # Flask 应用（gunicorn）
  # ──────────────────────────────────────────────────────────
  web:
    build: .
    image: microblog:latest
    container_name: microblog-web
    restart: unless-stopped
    environment:
      # ─ 安全 ─
      BLOG_ENV: production
      # 留空时使用仅用于测试的内置默认密钥；公网部署必须在 .env.docker
      # 中设置 BLOG_SECRET_KEY（python -c "import secrets;print(secrets.token_hex(32))"）
      BLOG_SECRET_KEY: ${BLOG_SECRET_KEY:-insecure-compose-default-key-CHANGE-ME-0123456789abcdef}
      BLOG_DEBUG: "False"
      # 编排内置的 nginx 只提供明文 HTTP(80)，默认关闭 Secure，保证 HTTP 下登录正常；
      # 自行配置 HTTPS（443）后请在 .env.docker 中置为 true
      BLOG_COOKIE_SECURE: ${BLOG_COOKIE_SECURE:-false}
      # 固定外链域名（邮件重置链接/订阅源/sitemap 使用，防 Host 头注入）
      # 生产请改为真实域名，如 https://blog.example.com
      BLOG_CANONICAL_URL: ${BLOG_CANONICAL_URL:-}
      # Host 白名单（逗号分隔），非白名单 Host 请求返回 400；
      # 留空不校验（测试便捷），生产建议设置为真实域名
      BLOG_TRUSTED_HOSTS: ${BLOG_TRUSTED_HOSTS:-}

      # ─ 数据库类型：sqlite 或 mysql ─
      # 用 mysql 时下方 BLOG_MYSQL_* 生效；用 sqlite 时 BLOG_SQLITE_PATH 生效
      BLOG_DB_TYPE: ${BLOG_DB_TYPE:-mysql}

      # ─ MySQL 连接（指向同 compose 的 db 服务） ─
      # 默认密码与 db 服务保持一致，仅本机测试用；生产在 .env.docker 覆盖
      BLOG_MYSQL_HOST: db
      BLOG_MYSQL_USER: ${MYSQL_USER:-blog}
      BLOG_MYSQL_PWD: ${MYSQL_PASSWORD:-blog123456-change-me}
      BLOG_MYSQL_DB: ${MYSQL_DATABASE:-flask_blog}

      # ─ SQLite 路径（仅 BLOG_DB_TYPE=sqlite 时使用） ─
      BLOG_SQLITE_PATH: data/blog.db

      # ─ 业务参数 ─
      # Session 有效期（秒，默认 86400 = 24 小时；登录态 session.permanent 生效）
      BLOG_SESSION_LIFETIME: ${BLOG_SESSION_LIFETIME:-86400}
      BLOG_PAGE_SIZE: ${BLOG_PAGE_SIZE:-6}
      BLOG_STATIC_MAX_AGE: ${BLOG_STATIC_MAX_AGE:-43200}
      # 密码找回令牌有效期（秒，默认 1800）
      BLOG_RESET_TOKEN_MAX_AGE: ${BLOG_RESET_TOKEN_MAX_AGE:-1800}

      # ─ SMTP 邮件（可选）：不配置时在 管理后台 → 邮件设置 中填写（后台优先） ─
      BLOG_MAIL_HOST: ${BLOG_MAIL_HOST:-}
      BLOG_MAIL_PORT: ${BLOG_MAIL_PORT:-587}
      BLOG_MAIL_USER: ${BLOG_MAIL_USER:-}
      BLOG_MAIL_PASSWORD: ${BLOG_MAIL_PASSWORD:-}
      BLOG_MAIL_FROM: ${BLOG_MAIL_FROM:-}
      BLOG_MAIL_USE_SSL: ${BLOG_MAIL_USE_SSL:-false}
      BLOG_MAIL_USE_TLS: ${BLOG_MAIL_USE_TLS:-true}

      # ─ 反代头解析（经 nginx 时取真实客户端 IP / 协议） ─
      BLOG_PROXY_XFOR: "1"
      BLOG_PROXY_XPROTO: "1"
      # nginx 已显式 proxy_set_header Host $host，无需信任 X-Forwarded-Host
      BLOG_PROXY_XHOST: "0"

      # ─ 初始管理员 ─
      # 留空则不自动建号，首访 /admin/setup 通过引导页创建；
      # 填入密码则首次初始化时自动创建（仅 admin 表为空时生效一次）
      BLOG_INIT_ADMIN_USER: ${BLOG_INIT_ADMIN_USER:-admin}
      BLOG_INIT_ADMIN_PWD: ${BLOG_INIT_ADMIN_PWD:-}
    ports:
      # 仅绑定宿主机回环地址：SQLite 模式可直连 http://127.0.0.1:5000 调试；
      # full 模式经 nginx 80 端口访问，此映射可保留不影响。
      # 端口冲突时在 .env.docker 设置 WEB_PORT。
      - "127.0.0.1:${WEB_PORT:-5000}:5000"
    volumes:
      # SQLite 数据文件持久化（mysql 模式下也无害）
      - ./data:/app/data
      # 上传的轮播图持久化
      - ./static/banner:/app/static/banner
      # 文章图 / Logo / 自定义背景持久化（nginx 也从宿主机同目录读）
      - ./static/uploads:/app/static/uploads
      # 数据库备份持久化（容器重建不丢失）
      - ./backups:/app/backups
    depends_on:
      # MySQL 模式等 db 健康检查通过后再启动 web（init.sql 此时已执行完）。
      # required: false：db 的 profile 未启用（SQLite 模式）时该依赖自动忽略，
      # 需 Docker Compose v2.20+；应用启动时另有 MySQL 就绪等待作为兜底。
      db:
        condition: service_healthy
        required: false
    networks:
      - blog-net

  # ──────────────────────────────────────────────────────────
  # 启动前环境变量预检守卫（一次性容器，复用 db 的 mysql 镜像不增加额外下载）：
  # MySQL 口令缺失/仍为占位符或公开默认值时输出中英双语指引并以非零码退出，
  # db 因依赖关系不会启动（web 在 MySQL 模式下等 db 健康，也随之不接入）。
  # SQLite 模式（仅 docker compose up -d web）不经过本守卫，无需任何密码。
  # 不用 ${VAR:?} 插值守卫——那种报错带 compose 固定英文前缀（required variable ... is missing），无法定制。
  # ──────────────────────────────────────────────────────────
  env-check:
    image: mysql:8.4
    entrypoint: ["sh", "-c"]
    restart: "no"
    profiles: ["full", "mysql"]
    volumes:
      # 挂载 MySQL/ 用于预检 init.sql 是否已存在（防止忘记拷贝时
      # bind mount 把 MySQL/init.sql 变成空目录导致启动异常）
      - ./MySQL:/check:ro
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}
      # 与下方 web 服务保持同一默认值：未设置时守卫能看到公开默认密钥并告警
      BLOG_SECRET_KEY: ${BLOG_SECRET_KEY:-insecure-compose-default-key-CHANGE-ME-0123456789abcdef}
    command:
      - |
        fail=0
        warn=0
        if [ ! -f /check/init.sql ]; then
          echo "[启动中止] 缺少 MySQL/init.sql：请先从仓库确认该文件存在（缺失时 bind mount 会创建同名空目录导致初始化失败）"
          echo "[ABORT] Missing MySQL/init.sql: make sure the file exists in the repo (a missing host file makes the bind mount an empty directory and breaks first-time initialization)"
          fail=1
        fi
        if [ -z "$$MYSQL_ROOT_PASSWORD" ]; then
          echo "[启动中止] 缺少 MySQL 管理员口令：请在 .env.docker 设置 MYSQL_ROOT_PASSWORD（建议 openssl rand -base64 24）"
          echo "[ABORT] Missing MySQL administrator password: set MYSQL_ROOT_PASSWORD in .env.docker (suggested: openssl rand -base64 24)"
          fail=1
        elif [ "$$MYSQL_ROOT_PASSWORD" = "请替换为强密码" ] || [ "$$MYSQL_ROOT_PASSWORD" = "root123456-change-me" ]; then
          echo "[启动中止] MYSQL_ROOT_PASSWORD 仍是占位符/公开默认值：请在 .env.docker 中改为强密码（建议 openssl rand -base64 24），切勿用默认密码上公网"
          echo "[ABORT] MYSQL_ROOT_PASSWORD is still a placeholder/public default: set a strong password in .env.docker (suggested: openssl rand -base64 24); never expose defaults publicly"
          fail=1
        fi
        if [ -z "$$MYSQL_PASSWORD" ]; then
          echo "[启动中止] 缺少数据库业务账号口令：请在 .env.docker 设置 MYSQL_PASSWORD（业务账号博客应用连库口令，建议 openssl rand -base64 24）"
          echo "[ABORT] Missing database application password: set MYSQL_PASSWORD in .env.docker (password for the application account; suggested: openssl rand -base64 24)"
          fail=1
        elif [ "$$MYSQL_PASSWORD" = "请替换为强密码" ] || [ "$$MYSQL_PASSWORD" = "blog123456-change-me" ]; then
          echo "[启动中止] MYSQL_PASSWORD 仍是占位符/公开默认值：请在 .env.docker 中改为强密码（建议 openssl rand -base64 24），切勿用默认密码上公网"
          echo "[ABORT] MYSQL_PASSWORD is still a placeholder/public default: set a strong password in .env.docker (suggested: openssl rand -base64 24); never expose defaults publicly"
          fail=1
        fi
        if [ "$$BLOG_SECRET_KEY" = "insecure-compose-default-key-CHANGE-ME-0123456789abcdef" ]; then
          echo "[安全警告] BLOG_SECRET_KEY 仍为公开测试默认密钥：本机测试可用；公网部署必须在 .env.docker 设置随机值（python -c \"import secrets;print(secrets.token_hex(32))\"）"
          echo "[SECURITY WARNING] BLOG_SECRET_KEY is the public test default: fine for local testing; for public deployment set a random value in .env.docker (python -c \"import secrets;print(secrets.token_hex(32))\")"
          warn=1
        fi
        if [ "$$fail" = "1" ]; then
          echo "------------------------------------------------------------------------"
          echo "请补全 .env.docker 后重新执行 / Fill in .env.docker, then run again: docker compose --env-file .env.docker --profile full up -d"
          exit 1
        fi
        if [ "$$warn" = "1" ]; then
          echo "[预检通过（含警告）/ PASS (with warnings)] 数据库必填环境变量已配置 / Required database environment variables are set"
        else
          echo "[预检通过 / PASS] 数据库必填环境变量已配置 / Required database environment variables are set"
        fi

  # ──────────────────────────────────────────────────────────
  # MySQL 8.4 数据库
  # ──────────────────────────────────────────────────────────
  db:
    image: mysql:8.4
    container_name: microblog-db
    restart: unless-stopped
    depends_on:
      # 先跑 env-check 预检守卫（口令缺失/仍为默认值时中止，db 不会启动）
      env-check:
        condition: service_completed_successfully
    environment:
      # 默认值仅用于本机测试（端口默认不对外暴露）；任何非本机测试场景
      # 都应在 .env.docker 中覆盖，切勿用默认密码上公网。
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456-change-me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-flask_blog}
      MYSQL_USER: ${MYSQL_USER:-blog}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-blog123456-change-me}
      TZ: Asia/Shanghai
    # ⚠️ 8.4 兼容说明：--default-authentication-plugin 已在 MySQL 8.4 中移除
    # （保留会导致容器启动失败：unknown variable），必须删除。
    # 改用 --mysql-native-password=ON：8.4 起该插件默认关闭，开启它是为了兼容
    # 存量 8.0 数据卷里以 mysql_native_password 建的账号（首启升级 8.0→8.4 后
    # 旧账号仍能登录）。新初始化的数据卷走 8.4 默认 caching_sha2_password，
    # 应用侧 PyMySQL(1.2.0)+cryptography(43.0.1) 已完整支持。
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --sql-mode=STRICT_TRANS_TABLES,NO_ENGINE_SUBSTITUTION
      - --mysql-native-password=ON
    volumes:
      - microblog-mysql-data:/var/lib/mysql
      # 首次启动自动导入建表 SQL
      - ./MySQL/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root123456-change-me}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # 默认不暴露 MySQL 端口到宿主机；如需从宿主机连数据库，取消下方注释
    # ports:
    #   - "3306:3306"
    profiles: ["full", "mysql"]
    networks:
      - blog-net

  # ──────────────────────────────────────────────────────────
  # Nginx 反向代理（可选，生产推荐）
  # 启用方式：docker compose --profile full up -d
  # ──────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: microblog-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      # 启用 HTTPS 时取消注释（同时按 nginx/nginx.conf 顶部说明操作）：
      # 1) 证书放到宿主机 ./nginx/certs/（fullchain.pem / privkey.pem）
      # 2) 取消下方 443 端口与 certs 目录挂载两行注释
      # 3) 取消 nginx.conf 中 443 server 块与 80 跳转行的注释
      # 4) .env.docker 设 BLOG_COOKIE_SECURE=true 后重建
      #- "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # 证书目录（只读）；未挂载且未启用 443 配置时不影响默认 HTTP 启动
      #- ./nginx/certs:/etc/nginx/certs:ro
      - ./static:/app/static:ro
    depends_on:
      # 等 web 健康检查（/healthz）通过后再接入流量
      web:
        condition: service_healthy
    healthcheck:
      # 探测 nginx 自身（/nginx-health 不经过反代、不依赖后端）：
      # web 故障时 nginx 仍算 healthy（否则 /healthz 会 502 造成误判）
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    profiles: ["full"]
    networks:
      - blog-net

# ──────────────────────────────────────────────────────────
# 持久化卷
# ──────────────────────────────────────────────────────────
volumes:
  microblog-mysql-data:
    name: microblog-mysql-data

# ──────────────────────────────────────────────────────────
# 内部网络
# ──────────────────────────────────────────────────────────
networks:
  blog-net:
    name: blog-net
    driver: bridge
