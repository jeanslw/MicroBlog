# Flask 博客系统 Docker Compose 编排：web(Flask) + db(MySQL 8) + nginx(可选反代)
#
# profile:
#   (无)             docker compose up -d web        仅 web(SQLite)，无需任何 env 文件
#   --profile mysql  web + db(MySQL，自行外接反代)
#   --profile full   web + db + nginx(HTTP 80 开箱即用)
#
# MySQL 模式需先准备 .env.docker：cp .env.docker.example .env.docker
# 预检输出不随 up -d 打印，查看方式：docker compose --profile full logs env-check

services:
  web:
    build: .
    image: microblog:latest
    container_name: microblog-web
    restart: unless-stopped
    environment:
      # 安全
      BLOG_ENV: production
      # 留空即可：入口脚本首次启动生成随机密钥并持久化到 ./data/.secret_key
      BLOG_SECRET_KEY: ${BLOG_SECRET_KEY:-}
      BLOG_DEBUG: "False"
      # 自建 HTTPS 后置为 true
      BLOG_COOKIE_SECURE: ${BLOG_COOKIE_SECURE:-false}
      # 外链域名（邮件重置链接 / 订阅源 / sitemap），生产须改为真实域名
      BLOG_CANONICAL_URL: ${BLOG_CANONICAL_URL:-}
      # 非白名单 Host 请求返回 400；留空不校验
      BLOG_TRUSTED_HOSTS: ${BLOG_TRUSTED_HOSTS:-}

      # 数据库类型：sqlite 或 mysql
      BLOG_DB_TYPE: ${BLOG_DB_TYPE:-sqlite}

      # MySQL 连接（指向同 compose 的 db 服务）
      BLOG_MYSQL_HOST: db
      BLOG_MYSQL_USER: ${MYSQL_USER:-blog}
      BLOG_MYSQL_PWD: ${MYSQL_PASSWORD:-blog123456-change-me}
      BLOG_MYSQL_DB: ${MYSQL_DATABASE:-flask_blog}

      # SQLite 路径，仅 BLOG_DB_TYPE=sqlite 时使用
      BLOG_SQLITE_PATH: data/blog.db

      # 业务参数
      # Session 有效期（秒，默认 86400 = 24 小时）
      BLOG_SESSION_LIFETIME: ${BLOG_SESSION_LIFETIME:-86400}
      BLOG_PAGE_SIZE: ${BLOG_PAGE_SIZE:-6}
      BLOG_STATIC_MAX_AGE: ${BLOG_STATIC_MAX_AGE:-43200}
      # 密码找回令牌有效期(秒,默认 1800)
      BLOG_RESET_TOKEN_MAX_AGE: ${BLOG_RESET_TOKEN_MAX_AGE:-1800}

      # 日志目录：容器 /app/logs -> 宿主机 ./data/logs
      # 级别：auto 跟随 BLOG_DEBUG，可选 DEBUG/INFO/WARNING/ERROR/CRITICAL
      BLOG_LOG_LEVEL: ${BLOG_LOG_LEVEL:-auto}
      # 格式：auto 生产 JSON / 开发文本，可强制 json 或 text
      BLOG_LOG_FORMAT: ${BLOG_LOG_FORMAT:-auto}
      # 文件轮转：单文件 10MB，保留 5 份
      BLOG_LOG_MAX_BYTES: ${BLOG_LOG_MAX_BYTES:-10485760}
      BLOG_LOG_BACKUP_COUNT: ${BLOG_LOG_BACKUP_COUNT:-5}

      # SMTP 邮件（可选，后台配置优先）
      BLOG_MAIL_HOST: ${BLOG_MAIL_HOST:-}
      BLOG_MAIL_PORT: ${BLOG_MAIL_PORT:-587}
      BLOG_MAIL_USER: ${BLOG_MAIL_USER:-}
      BLOG_MAIL_PASSWORD: ${BLOG_MAIL_PASSWORD:-}
      BLOG_MAIL_FROM: ${BLOG_MAIL_FROM:-}
      BLOG_MAIL_USE_SSL: ${BLOG_MAIL_USE_SSL:-false}
      BLOG_MAIL_USE_TLS: ${BLOG_MAIL_USE_TLS:-true}

      # 反代头解析（经 nginx 时取真实客户端 IP / 协议）
      BLOG_PROXY_XFOR: "1"
      BLOG_PROXY_XPROTO: "1"
      # nginx 已显式设置 Host 头，无需信任 X-Forwarded-Host
      BLOG_PROXY_XHOST: "0"

      # 初始管理员：留空走 /admin/setup 引导页，填密码则初始化时自动创建一次
      BLOG_INIT_ADMIN_USER: ${BLOG_INIT_ADMIN_USER:-admin}
      BLOG_INIT_ADMIN_PWD: ${BLOG_INIT_ADMIN_PWD:-}
    ports:
      # 仅绑定宿主机回环地址；端口冲突时在 .env.docker 设置 WEB_PORT
      - "127.0.0.1:${WEB_PORT:-5000}:5000"
    volumes:
      - ./data:/app/data
      - ./uploads/banner:/app/uploads/banner
      - ./uploads/image:/app/uploads/image
      - ./backups:/app/backups
      - ./data/logs:/app/logs
    depends_on:
      # MySQL 模式等 db 健康检查通过后再启动 web；profile 未启用时该依赖自动忽略
      db:
        condition: service_healthy
        required: false
    networks:
      - blog-net

  # 启动前环境变量预检守卫，失败时中止启动。
  # 中止项：MySQL/init.sql 缺失、口令为模板占位符、口令被显式设为公开默认值。
  # 未提供口令仅告警放行（db 使用内置测试口令，端口不对宿主机暴露）。
  env-check:
    image: mysql:8.4
    entrypoint: ["sh", "-c"]
    restart: "no"
    profiles: ["full", "mysql"]
    volumes:
      - ./MySQL:/check:ro
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}
      # 非空表示口令由用户显式提供（用于区分未配置与显式弱口令）
      MYSQL_ROOT_PASSWORD_SET: ${MYSQL_ROOT_PASSWORD:+1}
      MYSQL_PASSWORD_SET: ${MYSQL_PASSWORD:+1}
      # 与 web 服务保持同一默认值，未显式提供密钥时守卫给出提示而非中止
      BLOG_SECRET_KEY: ${BLOG_SECRET_KEY:-insecure-compose-default-key-CHANGE-ME-0123456789abcdef}
    command:
      - |
        fail=0
        warn=0
        if [ ! -f /check/init.sql ]; then
          echo "[启动中止] 缺少 MySQL/init.sql：请先从仓库确认该文件存在（缺失时 bind mount 会创建同名空目录导致初始化失败）"
          echo "[ABORT] Missing MySQL/init.sql: make sure the file exists in the repo (a missing host file makes the bind mount an empty directory and breaks first-time initialization)"
          fail=1
        fi
        # check_pwd <变量名> <值> <是否显式设置> <用途说明>
        check_pwd() {
          pname="$1"
          pvalue="$2"
          pset="$3"
          prole="$4"
          if [ "$$pvalue" = "请替换为强密码" ]; then
            echo "[启动中止] $$pname 仍是模板占位符：请在 .env.docker 中改为强密码（建议 openssl rand -base64 24）"
            echo "[ABORT] $$pname is still the template placeholder: set a strong password in .env.docker (suggested: openssl rand -base64 24)"
            fail=1
          elif [ -n "$$pset" ] && { [ "$$pvalue" = "root123456-change-me" ] || [ "$$pvalue" = "blog123456-change-me" ]; }; then
            echo "[启动中止] $$pname 被显式设为公开默认口令：该值公开在仓库里，任何人都能连库。请改为强密码（建议 openssl rand -base64 24）后重试"
            echo "[ABORT] $$pname is explicitly set to a public default password: it is published in the repo. Set a strong password (suggested: openssl rand -base64 24) and retry"
            fail=1
          elif [ -z "$$pset" ]; then
            echo "[安全警告] 未在 .env.docker 提供 $$pname（$$prole）：将使用 db 内置的公开测试口令，且 db 端口不对宿主机暴露，仅适合本机试用。公网部署前请执行 cp .env.docker.example .env.docker 并填写强密码"
            echo "[SECURITY WARNING] $$pname ($$prole) not provided in .env.docker: falling back to the built-in public test password of the db service, with no host port exposed - local trial only. Before public deployment run: cp .env.docker.example .env.docker and set strong passwords"
            warn=1
          fi
        }
        check_pwd MYSQL_ROOT_PASSWORD "$$MYSQL_ROOT_PASSWORD" "$$MYSQL_ROOT_PASSWORD_SET" "MySQL 管理员口令 / MySQL administrator password"
        check_pwd MYSQL_PASSWORD "$$MYSQL_PASSWORD" "$$MYSQL_PASSWORD_SET" "业务账号 blog 的连库口令 / application account password"
        if [ "$$BLOG_SECRET_KEY" = "insecure-compose-default-key-CHANGE-ME-0123456789abcdef" ]; then
          echo "[安全提示] 未在 .env.docker 显式设置 BLOG_SECRET_KEY：web 容器入口脚本会自动生成 64 位随机密钥并持久化到宿主机 ./data/.secret_key（容器重建后登录态不失效；多实例部署或迁移需共享同一密钥时请显式设置，生成命令见下）（python -c \"import secrets;print(secrets.token_hex(32))\"）"
          echo "[SECURITY NOTE] BLOG_SECRET_KEY not set in .env.docker: the web entrypoint generates a random 64-hex key persisted to ./data/.secret_key on the host (survives container recreation; set it explicitly to share one key across instances) (python -c \"import secrets;print(secrets.token_hex(32))\")"
          warn=1
        fi
        if [ "$$fail" = "1" ]; then
          echo "------------------------------------------------------------------------"
          echo "上方的检查说明指出了需要修复的项 / The checks above explain what to fix."
          echo "  1) 看详情 / details : docker compose --profile full logs env-check"
          echo "  2) 备配置 / prepare : cp .env.docker.example .env.docker   (Windows: Copy-Item .env.docker.example .env.docker)"
          echo "  3) 再启动 / restart : docker compose --env-file .env.docker --profile full up -d"
          exit 1
        fi
        if [ "$$warn" = "1" ]; then
          echo "[预检通过（含警告）/ PASS (with warnings)] 允许启动，公网部署前请按上面的警告加固 / startup allowed - harden the warnings above before going public"
          echo "[提示 / TIP] 查看本预检的完整输出 / full pre-check output: docker compose --profile full logs env-check"
        else
          echo "[预检通过 / PASS] 环境变量检查通过 / environment variables OK"
        fi

  db:
    image: mysql:8.4
    container_name: microblog-db
    restart: unless-stopped
    depends_on:
      # 先跑 env-check 预检守卫，中止时本服务不启动
      env-check:
        condition: service_completed_successfully
    environment:
      # 默认密码仅本机测试用，生产须在 .env.docker 中覆盖
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456-change-me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-flask_blog}
      MYSQL_USER: ${MYSQL_USER:-blog}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-blog123456-change-me}
      TZ: Asia/Shanghai
    # MySQL 8.4 已移除 --default-authentication-plugin（保留会启动失败），
    # 改用 --mysql-native-password=ON 兼容存量 8.0 数据卷中以 mysql_native_password 建的账号
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --sql-mode=STRICT_TRANS_TABLES,NO_ENGINE_SUBSTITUTION
      - --mysql-native-password=ON
    volumes:
      - microblog-mysql-data:/var/lib/mysql
      # 首次启动自动导入建表 SQL
      - ./MySQL/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root123456-change-me}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # 默认不暴露 MySQL 端口到宿主机；如需从宿主机连数据库，取消下方注释
    # ports:
    #   - "3306:3306"
    profiles: ["full", "mysql"]
    networks:
      - blog-net

  # Nginx 反向代理，启用方式：docker compose --profile full up -d
  nginx:
    image: nginx:1.27-alpine
    container_name: microblog-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      # 启用 HTTPS 时取消注释（操作说明见 nginx/nginx.conf 顶部）
      #- "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      #- ./nginx/certs:/etc/nginx/certs:ro
      # 不挂载 static / uploads：nginx 只做反代，静态与上传资源由 web 容器提供
    depends_on:
      # 等 web 健康检查（/healthz）通过后再接入流量
      web:
        condition: service_healthy
    healthcheck:
      # 探测 nginx 自身（/nginx-health 不经反代），web 故障时仍判定 healthy
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    profiles: ["full"]
    networks:
      - blog-net

# 持久化卷
volumes:
  microblog-mysql-data:
    name: microblog-mysql-data

# 内部网络
networks:
  blog-net:
    name: blog-net
    driver: bridge
