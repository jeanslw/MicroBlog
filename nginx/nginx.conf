# ============================================================
# Nginx 反向代理配置（用于 docker-compose 的 nginx 服务）
# 挂载路径：容器内 /etc/nginx/conf.d/default.conf
#
# nginx 只负责：TLS 终结、纯转发、缓冲/超时。
# 安全响应头（CSP/X-Frame-Options/nosniff/Referrer-Policy/HSTS）、
# 静态资源缓存（Cache-Control immutable）、上传资源防盗链
# 均已由应用层统一处理（app/__init__.py，随代码进版本库、有测试覆盖）。
# ⚠️ 勿在此 add_header 重复下发 CSP：浏览器对多份 CSP 取交集执行，
#    配置稍有出入就会出现"莫名拦资源"。
#
# 默认仅监听明文 HTTP(80)，开箱即用。
# 启用 HTTPS 的步骤（配置已全部写好，只需取消注释）：
#   1. 证书放到宿主机 ./nginx/certs/ 目录：
#        fullchain.pem  证书（含完整证书链）
#        privkey.pem    私钥
#   2. docker-compose.yml 中取消 nginx 的 443 端口与
#      ./nginx/certs 挂载两行注释，重建服务：
#        docker compose --env-file .env.docker --profile full up -d
#   3. .env.docker 设置 BLOG_COOKIE_SECURE=true，重建 web
#   4. 取消本文件下方 443 server 块的注释（server_name 改成真实域名），
#      并取消 80 server 中 "return 301 https://..." 一行的注释
# ============================================================

# 上游 Flask 应用
upstream flask_blog {
    server web:5000;
    # 多实例时在此追加：server web2:5000;
}

server {
    listen 80;
    # ⚠️ 生产部署请将 server_name 改为你的真实域名（如 blog.example.com），
    #    不要保留 "_"，否则任意 Host 头都会命中本 server，配合 Flask Host 白名单
    #    （BLOG_TRUSTED_HOSTS）使用效果最佳。
    server_name _;

    # ── 启用 HTTPS 后：取消下面一行注释，HTTP(80) 请求全部 301 跳转到 HTTPS ──
    # 该指令在 server 级别优先于所有 location 生效；
    # 使用 Let's Encrypt HTTP-01 验证申请/续期证书时，请临时注释本行（或改用 DNS-01）。
    #return 301 https://$host$request_uri;

    # 访问日志
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # 注：请求体大小上限由应用层 MAX_CONTENT_LENGTH(16MB) 强制（返回 413），
    #     无需在此配置 client_max_body_size；静态文件直接走下方转发由 Flask 提供
    #     （含缓存与防盗链策略），无需单独 location。

    # 其余请求转发到 Flask
    location / {
        proxy_pass http://flask_blog;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 关闭连接缓冲，避免大响应被截断
        proxy_buffering off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 健康检查端点：不带 URI 的 proxy_pass 保留原始路径 /healthz
    # （写成 http://flask_blog/ 会被重写为 /，实际打到首页并被 Host 白名单拒绝）
    location = /healthz {
        access_log off;
        proxy_pass http://flask_blog;
        proxy_set_header Host $host;
    }
}

