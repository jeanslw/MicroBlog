# ============================================================
# Nginx 反向代理配置（用于 docker-compose 的 nginx 服务）
# 挂载路径：容器内 /etc/nginx/conf.d/default.conf
#
# 默认仅监听明文 HTTP(80)，开箱即用。
# 启用 HTTPS 的步骤（配置已全部写好，只需取消注释）：
#   1. 证书放到宿主机 ./nginx/certs/ 目录：
#        fullchain.pem  证书（含完整证书链）
#        privkey.pem    私钥
#   2. docker-compose.yml 中取消 nginx 的 443 端口与
#      ./nginx/certs 挂载两行注释，重建服务：
#        docker compose --env-file .env.docker --profile full up -d
#   3. .env.docker 设置 BLOG_COOKIE_SECURE=true，重建 web
#   4. 取消本文件下方 443 server 块的注释（server_name 改成真实域名），
#      并取消 80 server 中 "return 301 https://..." 一行的注释
# ============================================================

# 上游 Flask 应用
upstream flask_blog {
    server web:5000;
    # 多实例时在此追加：server web2:5000;
}

server {
    listen 80;
    # ⚠️ 生产部署请将 server_name 改为你的真实域名（如 blog.example.com），
    #    不要保留 "_"，否则任意 Host 头都会命中本 server，配合 Flask Host 白名单
    #    （BLOG_TRUSTED_HOSTS）使用效果最佳。
    server_name _;

    # ── 启用 HTTPS 后：取消下面一行注释，HTTP(80) 请求全部 301 跳转到 HTTPS ──
    # 该指令在 server 级别优先于所有 location 生效；
    # 使用 Let's Encrypt HTTP-01 验证申请/续期证书时，请临时注释本行（或改用 DNS-01）。
    #return 301 https://$host$request_uri;

    # 上传文件大小限制（与 MAX_CONTENT_LENGTH 一致）
    client_max_body_size 16m;

    # 访问日志
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # ── 安全响应头（全站） ──────────────────────────────
    # 禁止被外站 iframe 嵌套（防点击劫持）
    add_header X-Frame-Options "SAMEORIGIN" always;
    # 禁止浏览器嗅探 MIME 类型
    add_header X-Content-Type-Options "nosniff" always;
    # 控制 Referer 泄露
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP：允许本站资源、图片允许任意来源（文章外链图）、内联样式/脚本（当前模板依赖）。
    # 如需更严格，可将 'unsafe-inline' 替换为 nonce。
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self' data:; frame-ancestors 'self'" always;

    # ── 静态文件 ────────────────────────────────────────────
    # 注：部署时把 server_name _; 改成你的真实域名，
    #     valid_referers server_names 会自动匹配。

    # 轮播图：防盗链
    location /static/banner/ {
        alias /app/static/banner/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        # 防盗链：仅允许本站 Referer；none=空Referer(直接访问)，blocked=被代理擦除
        valid_referers none blocked server_names;
        if ($invalid_referer) {
            return 403;
        }
    }

    # 文章内上传图片：防盗链
    location /static/uploads/ {
        alias /app/static/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        valid_referers none blocked server_names;
        if ($invalid_referer) {
            return 403;
        }
    }

    # 其余静态资源（favicon、第三方库 JS/CSS）：不防盗链
    location /static/ {
        alias /app/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 其余请求转发到 Flask
    location / {
        proxy_pass http://flask_blog;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 关闭连接缓冲，避免大响应被截断
        proxy_buffering off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 健康检查端点：不带 URI 的 proxy_pass 保留原始路径 /healthz
    # （写成 http://flask_blog/ 会被重写为 /，实际打到首页）
    location = /healthz {
        access_log off;
        proxy_pass http://flask_blog;
        proxy_set_header Host $host;
    }
}

