# ============================================================
# Nginx 反向代理配置（用于 docker-compose 的 nginx 服务）
# 挂载路径：容器内 /etc/nginx/conf.d/default.conf
# ============================================================

# 上游 Flask 应用
upstream flask_blog {
    server web:5000;
    # 多实例时在此追加：server web2:5000;
}

server {
    listen 80;
    server_name _;

    # 上传文件大小限制（与 MAX_CONTENT_LENGTH 一致）
    client_max_body_size 16m;

    # 访问日志
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # 静态文件直接由 Nginx 提供（容器内挂载了 /app/static）
    location /static/ {
        alias /app/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 其余请求转发到 Flask
    location / {
        proxy_pass http://flask_blog;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 关闭连接缓冲，避免大响应被截断
        proxy_buffering off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 健康检查端点（可选）
    location = /healthz {
        access_log off;
        proxy_pass http://flask_blog/;
    }
}
