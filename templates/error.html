{% extends "base.html" %}
{% block title %}{{ code }} - {{ message }}{% endblock %}
{% block content %}
<div class="container py-5 text-center">
    <h1 class="display-1 fw-bold text-danger">{{ code }}</h1>
    <p class="lead">{{ message }}</p>
    <a href="{{ url_for('blog.index') }}" class="btn btn-primary mt-3">
        {% if current_lang == 'en' %}Back to Home{% else %}返回首页{% endif %}
    </a>
</div>
{% endblock %}
