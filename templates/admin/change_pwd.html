{% extends "admin/admin_base.html" %}
{% block title %}{{ _('修改后台密码') }} - {{ site_name }}{% endblock %}

{% block breadcrumb %}
<li class="breadcrumb-item active" aria-current="page">{{ _('修改密码') }}</li>
{% endblock %}

{% block admin_content %}
<div class="row justify-content-center">
    <div class="col-xl-9 col-xxl-7">
        <div class="card admin-panel-card p-5">
            <h4 class="mb-4 fw-bold"><i class="bi bi-key-fill text-warning"></i> {{ _('修改登录密码') }}</h4>
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3">
                    <label class="form-label">{{ _('原密码') }}</label>
                    <input type="password" name="old_pwd" class="form-control form-control-lg" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">{{ _('新密码') }}</label>
                    <input type="password" name="new_pwd" class="form-control form-control-lg" required>
                </div>
                <div class="mb-4">
                    <label class="form-label">{{ _('确认新密码') }}</label>
                    <input type="password" name="confirm_pwd" class="form-control form-control-lg" required>
                </div>
                <button class="btn btn-warning w-100 py-2">{{ _('确认修改') }}</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
